<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이렐리아 가이드 — 스킨 갤러리</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      body {
        margin: 0;
        background-color: #0f1115;
        color: white;
      }

      /* 스킨 페이지 전용 배경 */
      .skin-page::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("그냥이렐리아.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(4px) brightness(0.35);
        z-index: -1;
      }

      .skin-wrap {
        width: 90%;
        max-width: 1000px;
        margin: 40px auto;
        text-align: center;
      }

      #skin-img {
        width: 100%;
        height: 550px;
        object-fit: contain;
        display: block;
        margin: 0 auto;
        transition: opacity 0.2s ease;
      }

      .skin-ctrl {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
      }

      .skin-ctrl button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #d4af37;
        color: #111;
        font-weight: bold;
      }

      .skin-ctrl button:hover {
        opacity: 0.8;
      }

      #skin-name {
        font-size: 22px;
        color: #d4af37;
        margin: 0;
      }

      #skin-count {
        color: #aaa;
        margin-top: 5px;
      }

      .dot-list {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
      }

      .skin-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        background-color: #555;
      }

      .skin-dot.active {
        background-color: #d4af37;
      }

      main {
        padding: 40px 0;
        text-align: center;
      }
    </style>
  </head>

  <body class="skin-page">
    <nav>
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">IRELIA</a>

        <div class="nav-links">
          <a href="main.html">홈</a>
          <a href="skill.html">스킬</a>
          <a href="build.html">빌드</a>
          <a href="counter.html">상성표</a>
          <a href="skin.html" class="active">스킨</a>
        </div>

        <span class="nav-user"></span>
      </div>
    </nav>

    <main>
      <h1>스킨 갤러리</h1>
      <p>이전 / 다음 버튼으로 스킨을 감상하세요</p>

      <div class="skin-wrap">
        <img id="skin-img" src="" alt="" />

        <div class="skin-ctrl">
          <button id="prev-btn">◀ 이전</button>

          <div>
            <p id="skin-name"></p>
            <p id="skin-count"></p>
          </div>

          <button id="next-btn">다음 ▶</button>
        </div>

        <div class="dot-list">
          <button class="skin-dot"></button>
          <button class="skin-dot"></button>
          <button class="skin-dot"></button>
          <button class="skin-dot"></button>
          <button class="skin-dot"></button>
          <button class="skin-dot"></button>
          <button class="skin-dot"></button>
          <button class="skin-dot"></button>
          <button class="skin-dot"></button>
        </div>
      </div>
    </main>

    <footer>
      <p>@2026 IRELIA GUIDE by Lee Jin Mo</p>
    </footer>

    <script src="skin.js"></script>
  </body>
</html>
