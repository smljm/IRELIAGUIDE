<!doctype html>

<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이렐리아 가이드 — 추천 빌드</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page-bg">
    <nav>
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">IRELIA</a>
        <div class="nav-links">
          <a href="home.html">홈</a>

        </div>
        <span class="nav-user"></span>
      </div>

    <main class="build-page">
      <h1>추천 빌드</h1>
      <p class="build-sub">
        상황에 따라 선택할 수 있는 대표적인 이렐리아 빌드입니다.
      </p>
      <section class="build-case">
        <h2>기본 빌드</h2>
        <p class="build-desc">
          가장 안정적인 표준 빌드입니다. 대부분의 게임에서 무난하게 선택할 수
          있습니다.
        </p>
        <div class="build-area">
          <div class="build-box">
            <h3>아이템</h3>
            <img src="images/build_default_item.png" alt="기본 빌드 아이템" />
          </div>
          <div class="build-box">
            <h3>룬</h3>
            <img src="images/build_default_rune.png" alt="기본 빌드 룬" />
          </div>
        </div>
      </section>
      <section class="build-case">
        <h2>한타용 빌드</h2>
        <p class="build-desc">
          한타에서 오래 버티며 광역 교전을 수행할 때 사용하는 빌드입니다.
        </p>
        <div class="build-area">
          <div class="build-box">
            <h3>아이템</h3>
            <img src="images/build_team_item.png" alt="한타용 아이템" />
          </div>
          <div class="build-box">
            <h3>룬</h3>
            <img src="images/build_team_rune.png" alt="한타용 룬" />
          </div>
        </div>
      </section>
      <section class="build-case">
        <h2>사이드 운영 빌드</h2>
        <p class="build-desc">
          사이드 라인 압박과 1대1 교전에 집중할 때 사용하는 빌드입니다.
        </p>
        <div class="build-area">
          <div class="build-box">
            <h3>아이템</h3>
            <img src="images/build_side_item.png" alt="사이드용 아이템" />
          </div>
          <div class="build-box">
            <h3>룬</h3>
            <img src="images/build_side_rune.png" alt="사이드용 룬" />
          </div>
        </div>
      </section>
    </main>
