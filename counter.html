<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이렐리아 가이드 — 상성표</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page-bg">
    <nav>
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">IRELIA</a>
        <div class="nav-links">
          <a href="home.html">홈</a>
          <a href="skill.html">스킬</a>

          <a href="counter.html" class="active">상성표</a>
          <a href="skin.html">스킨</a>
        </div>
        <span class="nav-user"></span>
      </div>
    </nav>

    <main>
      <h1>상성표</h1>
      <p>챔피언 카드를 클릭하면 상세 이유를 볼 수 있습니다.</p>

      <section>
        <h2>유리한 상대</h2>
        <div class="champ-list">
          <div
            class="champ-card"
            data-name="요네"
            data-type="good"
            data-desc="요네는 초반 라인전에서 이렐리아의 강한 딜교환을 버티기 어렵다. 미니언을 활용한 Q 돌진과 패시브 스택을 이용하면 짧은 교전에서 우위를 점하기 쉽고, 요네의 E 복귀 지점을 노려 추가 피해를 넣을 수 있다."
          >
            <img src="요네.jpg" alt="요네" />
            <p>요네</p>
          </div>

          <div
            class="champ-card"
            data-name="사이온"
            data-type="good"
            data-desc="사이온은 몸집이 크고 스킬 모션이 느려 이렐리아의 E를 맞기 쉽다. 이렐리아는 기동성을 이용해 사이온의 주요 스킬을 피하면서 지속적으로 딜을 넣을 수 있으며, 사이온이 성장하기 전에 라인전 주도권을 잡기 좋다."
          >
            <img src="사이온.jpg" alt="사이온" />
            <p>사이온</p>
          </div>
        </div>
      </section>

      <section>
        <h2>불리한 상대</h2>
        <div class="champ-list">
          <div
            class="champ-card"
            data-name="뽀삐"
            data-type="bad"
            data-desc="뽀삐의 W는 이렐리아의 Q 돌진을 막아 핵심 콤보를 방해한다. 벽꿍까지 허용하면 큰 피해를 입기 때문에 라인전에서 매우 까다로운 상대이다."
          >
            <img src="뽀삐.jpg" alt="뽀삐" />
            <p>뽀삐</p>
          </div>

          <div
            class="champ-card"
            data-name="세트"
            data-type="bad"
            data-desc="세트는 강력한 근접 난전 능력과 높은 체력을 가지고 있어 이렐리아가 일방적으로 이득을 보기 어렵다. 특히 W의 보호막과 고정 피해 때문에 교전 타이밍을 잘못 잡으면 역으로 손해를 보기 쉽다."
          >
            <img src="세트.jpg" alt="세트" />
            <p>세트</p>
          </div>
        </div>
      </section>
    </main>

    <div id="modal-wrap" class="modal-wrap">
      <div class="modal-box">
        <button id="modal-close">✕</button>
        <h2 id="modal-name"></h2>
        <p id="modal-type"></p>
        <p id="modal-desc"></p>
      </div>
    </div>

    <footer>
      <p>@2026 IRELIA GUIDE by Lee Jin Mo</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/counter.js"></script>
  </body>
</html>
